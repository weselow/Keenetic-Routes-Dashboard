# VPN Routes Dashboard - lighttpd configuration
# Port: 8080

server.modules = (
    "mod_cgi",
    "mod_indexfile",
    "mod_staticfile"
)

server.document-root = "/opt/share/vpn-routes/www"
server.port = 8080
server.bind = "0.0.0.0"

server.pid-file = "/opt/var/run/vpn-routes-web.pid"
server.errorlog = "/opt/var/log/vpn-routes-web-error.log"

# Index file
index-file.names = ( "index.html" )

# MIME types
mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".gif"  => "image/gif",
    ".ico"  => "image/x-icon",
    ".svg"  => "image/svg+xml"
)

# CGI configuration
cgi.assign = ( ".cgi" => "" )

# Static file handling
static-file.exclude-extensions = ( ".cgi" )
